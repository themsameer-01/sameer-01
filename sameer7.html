<h2>HTML Character Entities</h2>

<p>Less than: &lt;</p>
<p>Greater than: &gt;</p>
<p>Ampersand: &amp;</p>
<p>Copyright: &copy; 2026</p>
<p>Registered: &reg;</p>
<p>Trademark: &trade;</p>
<p>Rupee: &#8377; 500</p>
<p>Plus or Minus: &plusmn;</p>
<p>Multiplication: &times;</p>
<p>Division: &divide;</p>
<p>Degree: 25&deg;C</p>
